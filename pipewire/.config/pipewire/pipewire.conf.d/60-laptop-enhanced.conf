# Enhanced "Laptop" sink: makes the small laptop speakers louder without clipping.
#
#   high-pass 150 Hz -> compressor (sc4) -> limiter at -1 dB -> Laptop speakers
#
# The high-pass drops bass the speakers can't reproduce (and that would only
# over-drive the cones). The compressor lifts quiet passages, and the limiter
# guarantees the output never clips. Requires swh-plugins.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop"
      media.name       = "Laptop"
      filter.graph = {
        nodes = [
          { type = builtin, name = hp_l, label = bq_highpass, control = { "Freq" = 150.0, "Q" = 0.707 } }
          { type = builtin, name = hp_r, label = bq_highpass, control = { "Freq" = 150.0, "Q" = 0.707 } }
          {
            type   = ladspa
            name   = comp
            plugin = sc4_1882
            label  = sc4
            control = {
              "RMS/peak"             = 0.3
              "Attack time (ms)"     = 10.0
              "Release time (ms)"    = 200.0
              "Threshold level (dB)" = -20.0
              "Ratio (1:n)"          = 3.0
              "Knee radius (dB)"     = 6.0
              "Makeup gain (dB)"     = 10.0
            }
          }
          {
            type   = ladspa
            name   = limit
            plugin = fast_lookahead_limiter_1913
            label  = fastLookaheadLimiter
            control = {
              "Input gain (dB)"  = 2.0
              "Limit (dB)"       = -1.0
              "Release time (s)" = 0.1
            }
          }
        ]
        links = [
          { output = "hp_l:Out", input = "comp:Left input" }
          { output = "hp_r:Out", input = "comp:Right input" }
          { output = "comp:Left output", input = "limit:Input 1" }
          { output = "comp:Right output", input = "limit:Input 2" }
        ]
        inputs  = [ "hp_l:In" "hp_r:In" ]
        outputs = [ "limit:Output 1" "limit:Output 2" ]
      }
      capture.props = {
        node.name      = "effect_input.laptop_enhanced"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "effect_output.laptop_enhanced"
        node.passive   = true
        target.object  = "alsa_output.pci-0000_00_1f.3.pro-output-0"
        audio.channels = 2
        audio.position = [ AUX0 AUX1 ]
        stream.dont-remix = true
      }
    }
  }
]
