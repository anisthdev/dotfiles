# "Laptop (Warm)" sink: speaker-correction EQ plus a psychoacoustic bass enhancer.
#
# The EQ cuts bass the speakers can't play (24 dB/oct at 170 Hz), adds body at
# 250 Hz, and pulls down the 3-6 kHz range that sounds harsh at high volume.
#
#   L/R ----------------------> EQ --+--> mix L/R -> compressor -> limiter -> Laptop speakers
#    \-> mono sum -> 50-150 Hz -> harmonics -> keep 180-1000 Hz --/
#
# The speakers can't play real bass, so the bass band is run through a harmonic
# generator and only its overtones are mixed back in; the ear fills in the
# missing fundamental. Raise or lower "Gain 2" on mix_l/mix_r to change how much
# bass you hear. Requires swh-plugins.
context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Laptop (Warm)"
      media.name       = "Laptop (Warm)"
      filter.graph = {
        nodes = [
          { type = builtin, name = in_l, label = copy }
          { type = builtin, name = in_r, label = copy }
          {
            type   = builtin
            name   = eq
            label  = param_eq
            config = {
              filters = [
                { type = bq_highpass,  freq = 170.0,  q = 0.54 }
                { type = bq_highpass,  freq = 170.0,  q = 1.31 }
                { type = bq_peaking,   freq = 250.0,  q = 1.0, gain = 3.0 }
                { type = bq_peaking,   freq = 3200.0, q = 1.4, gain = -5.0 }
                { type = bq_peaking,   freq = 6000.0, q = 2.0, gain = -2.5 }
                { type = bq_highshelf, freq = 9000.0, q = 0.7, gain = -1.0 }
              ]
            }
          }
          { type = builtin, name = bass_sum, label = mixer, control = { "Gain 1" = 0.5, "Gain 2" = 0.5 } }
          {
            type   = builtin
            name   = bass_band
            label  = param_eq
            config = {
              filters = [
                { type = bq_highpass, freq = 50.0,  q = 0.707 }
                { type = bq_lowpass,  freq = 150.0, q = 0.54 }
                { type = bq_lowpass,  freq = 150.0, q = 1.31 }
              ]
            }
          }
          {
            type   = ladspa
            name   = harmonics
            plugin = harmonic_gen_1220
            label  = harmonicGen
            control = {
              "Fundamental magnitude"  = 0.0
              "2nd harmonic magnitude" = 0.7
              "3rd harmonic magnitude" = 0.5
              "4th harmonic magnitude" = 0.25
              "5th harmonic magnitude" = 0.1
            }
          }
          {
            type   = builtin
            name   = bass_keep
            label  = param_eq
            config = {
              filters = [
                { type = bq_highpass, freq = 180.0,  q = 0.54 }
                { type = bq_highpass, freq = 180.0,  q = 1.31 }
                { type = bq_lowpass,  freq = 1000.0, q = 0.707 }
              ]
            }
          }
          { type = builtin, name = mix_l, label = mixer, control = { "Gain 1" = 1.0, "Gain 2" = 2.0 } }
          { type = builtin, name = mix_r, label = mixer, control = { "Gain 1" = 1.0, "Gain 2" = 2.0 } }
          {
            type   = ladspa
            name   = comp
            plugin = sc4_1882
            label  = sc4
            control = {
              "RMS/peak"             = 0.5
              "Attack time (ms)"     = 5.0
              "Release time (ms)"    = 120.0
              "Threshold level (dB)" = -10.0
              "Ratio (1:n)"          = 2.0
              "Knee radius (dB)"     = 6.0
              "Makeup gain (dB)"     = 3.0
            }
          }
          {
            type   = ladspa
            name   = limit
            plugin = fast_lookahead_limiter_1913
            label  = fastLookaheadLimiter
            control = {
              "Input gain (dB)"  = 0.0
              "Limit (dB)"       = -1.0
              "Release time (s)" = 0.05
            }
          }
        ]
        links = [
          { output = "in_l:Out", input = "eq:In 1" }
          { output = "in_r:Out", input = "eq:In 2" }
          { output = "in_l:Out", input = "bass_sum:In 1" }
          { output = "in_r:Out", input = "bass_sum:In 2" }
          { output = "bass_sum:Out", input = "bass_band:In 1" }
          { output = "bass_band:Out 1", input = "harmonics:Input" }
          { output = "harmonics:Output", input = "bass_keep:In 1" }
          { output = "eq:Out 1", input = "mix_l:In 1" }
          { output = "eq:Out 2", input = "mix_r:In 1" }
          { output = "bass_keep:Out 1", input = "mix_l:In 2" }
          { output = "bass_keep:Out 1", input = "mix_r:In 2" }
          { output = "mix_l:Out", input = "comp:Left input" }
          { output = "mix_r:Out", input = "comp:Right input" }
          { output = "comp:Left output", input = "limit:Input 1" }
          { output = "comp:Right output", input = "limit:Input 2" }
        ]
        inputs  = [ "in_l:In" "in_r:In" ]
        outputs = [ "limit:Output 1" "limit:Output 2" ]
      }
      capture.props = {
        node.name      = "effect_input.laptop_warm"
        media.class    = Audio/Sink
        audio.channels = 2
        audio.position = [ FL FR ]
      }
      playback.props = {
        node.name      = "effect_output.laptop_warm"
        node.passive   = true
        target.object  = "alsa_output.pci-0000_00_1f.3.pro-output-0"
        audio.channels = 2
        audio.position = [ AUX0 AUX1 ]
        stream.dont-remix = true
      }
    }
  }
]
