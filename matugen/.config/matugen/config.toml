[config]
version_check = false

[config.wallpaper]
command = "awww img --transition-type random {{image}}"
set = true

# The Quickshell apps' palettes, each in its own config folder; they
# reload them on change
[templates.quickbar]
input_path = './templates/colors.css'
output_path = '~/.config/quickbar/colors.css'

[templates.seedling]
input_path = './templates/colors.css'
output_path = '~/.config/seedling/colors.css'

[templates.margin]
input_path = './templates/colors.css'
output_path = '~/.config/margin/colors.css'

[templates.dogear]
input_path = './templates/colors.css'
output_path = '~/.config/dogear/colors.css'

[templates.starship]
input_path = './templates/starship2.toml'
output_path = '~/.config/starship.toml'

[templates.hyprland]
input_path = './templates/hyprland.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/current.theme'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.cava]
input_path = './templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'

[templates.cody]
input_path = './templates/cody-theme.toml'
output_path = '~/.config/cody/theme.toml'
post_hook = "sh -lc 'pgrep -f \"^/home/asif/Projects/lumen/cody/.venv/bin/python -m cody$\" | xargs -r kill -USR1'"

[templates.clipse]
input_path = './templates/clipse-colors.json'
output_path = '~/.config/clipse/custom_theme.json'

[templates.ghostty]
input_path = './templates/ghostty-colors.conf'
output_path = '~/.config/ghostty/colors.conf'
post_hook = 'pkill -USR2 ghostty'

[templates.foot]
input_path = './templates/foot.ini'
output_path = '~/.config/foot/colors.ini'

[templates.glow_style]
input_path = './templates/glow-style.json'
output_path = '~/.config/glow/matugen-style.json'

[templates.gtk3]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-3.0/matugen.css'

[templates.gtk3_overrides]
input_path = './templates/gtk3.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk3_dark]
input_path = './templates/gtk-dark.css'
output_path = '~/.config/gtk-3.0/gtk-dark.css'

[templates.gtk4]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
# Ghostty's tab bar reads this file too, and matugen's order isn't fixed: this
# hook and the ghostty one cover whichever is written last
post_hook = 'pkill -USR2 ghostty'

[templates.gtk4_dark]
input_path = './templates/gtk-dark.css'
output_path = '~/.config/gtk-4.0/gtk-dark.css'

[templates.firefox_private]
input_path = './templates/firefox-private.css'
output_path = '~/.mozilla/firefox/asif/chrome/userContent.css'

[templates.nvim]
input_path = './templates/background.lua'
output_path = '~/.config/nvim/lua/core/ui/background.lua'

[templates.nvim_mode]
input_path = './templates/nvim-mode.lua'
output_path = '~/.config/nvim/lua/core/ui/mode.lua'

[templates.tmux]
input_path = './templates/tmux-mode.conf'
output_path = '~/.config/tmux/mode.conf'
post_hook = "sh -c 'pgrep -x tmux >/dev/null && tmux source-file ~/.config/tmux/tmux.conf || true'"

# The colour of sysaud's glint on plugging in (its config reads it)
[templates.sysaud]
input_path = './templates/primary-color'
output_path = '~/.config/sysaud/primary-color'
