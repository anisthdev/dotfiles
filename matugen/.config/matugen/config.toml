[config]
version_check = false

[config.wallpaper]
command = "awww img --transition-type random {{image}}"
set = true

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.starship]
input_path = './templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.rofi]
input_path = './templates/colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.hyprland]
input_path = './templates/hyprland.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.mako]
input_path = './templates/mako.ini'
output_path = '~/.config/mako/config'
post_hook = '/home/asif/.config/matugen/post_scripts/set_mako_opacity.sh && makoctl reload'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/current.theme'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.cava]
input_path = './templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'

[templates.cody]
input_path = './templates/cody-theme.toml'
output_path = '~/.config/cody/theme.toml'
post_hook = "sh -lc 'pgrep -f \"^/home/asif/Projects/lumen/cody/.venv/bin/python -m cody$\" | xargs -r kill -USR1'"

[templates.clipse]
input_path = './templates/clipse-colors.json'
output_path = '~/.config/clipse/custom_theme.json'

[templates.ghostty]
input_path = './templates/ghostty-colors.conf'
output_path = '~/.config/ghostty/colors.conf'
post_hook = 'pkill -USR2 ghostty'

[templates.foot]
input_path = './templates/foot.ini'
output_path = '~/.config/foot/colors.ini'
post_hook = 'killall -USR2 foot'

[templates.glow_style]
input_path = './templates/glow-style.json'
output_path = '~/.config/glow/matugen-style.json'

[templates.gtk3]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'
post_hook = 'systemctl --user restart xdg-desktop-portal.service xdg-desktop-portal-gtk.service xdg-desktop-portal-hyprland.service'

[templates.gtk3_dark]
input_path = './templates/gtk-dark.css'
output_path = '~/.config/gtk-3.0/gtk-dark.css'

[templates.gtk4]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'

[templates.gtk4_dark]
input_path = './templates/gtk-dark.css'
output_path = '~/.config/gtk-4.0/gtk-dark.css'
