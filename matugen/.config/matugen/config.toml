[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "center"]
set = true

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.starship]
input_path = './templates/starship.toml'
output_path = '~/.config/starship.toml'

[templates.rofi]
input_path = './templates/colors.rasi'
output_path = '~/.config/rofi/colors.rasi'

[templates.hyprland]
input_path = './templates/hyprland.conf'
output_path = '~/.config/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.swayosd]
input_path = './templates/colors.css'
output_path = '~/.config/swayosd/colors.css'
post_hook = 'pkill swayosd-server; setsid uwsm app -- swayosd-server &>/dev/null &'

[templates.mako]
input_path = './templates/mako.ini'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload'

[templates.btop]
input_path = './templates/btop.theme'
output_path = '~/.config/btop/themes/current.theme'

[templates.yazi]
input_path = './templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.cava]
input_path = './templates/zathurarc'
output_path = '~/.config/zathura/zathurarc'
