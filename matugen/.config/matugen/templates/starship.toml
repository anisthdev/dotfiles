format = """
[░▒▓](tertiary)\
$os\
[$hostname](bg:tertiary fg:on_tertiary)\
[](bg:primary_container fg:tertiary)\
$directory\
[](fg:primary_container bg:secondary)\
$git_branch\
$git_status\
[](fg:secondary bg:#32302f)\
$python\
$nodejs\
$java\
$rust\
$golang\
$php\
$dart\
$lua\
[](fg:#32302f bg:#1D2021)\
\n~> """


palette= 'colors'

[palettes.colors]
primary = '{{colors.primary.default.hex}}'
on_primary = '{{colors.on_primary.default.hex}}'
primary_container = '{{colors.primary_container.default.hex}}'
on_primary_container = '{{colors.on_primary_container.default.hex}}'
secondary = '{{colors.secondary.default.hex}}'
on_secondary = '{{colors.on_secondary.default.hex}}'
tertiary = '{{colors.tertiary.default.hex}}'
on_tertiary = '{{colors.on_tertiary.default.hex}}'
surface = '{{colors.surface.default.hex}}'



[os]
disabled = false
style = "bg:tertiary fg:on_tertiary"
format = "[$symbol]($style)"

[os.symbols]
Ubuntu = " 󰕈 "
Arch = " 󰣇 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "

[hostname]
style = "bg:color3 fg:color4"
format = "[$ssh_symbol$hostname]($style)"
ssh_symbol = "󰣀 " 

[directory]
style = "fg:on_primary_container bg:primary_container"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󱔘 "
# "Downloads" = ""
"Music" = ""
"Pictures" = " "
"Study" = "󱉟 "
"Work" = "󱔟 "

[git_branch]
symbol = ""
style = "bg:secondary"
format = '[[ $symbol $branch ](fg:on_secondary bg:secondary)]($style)'

[git_status]
style = "bg:secondary"
format = '[[($all_status$ahead_behind )](fg:on_secondary bg:secondary)]($style)'

[dart]
symbol = " "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#0468D7 bg:#32302f)]($style)'


[nodejs]
symbol = " "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#b8bb26 bg:#32302f)]($style)'

[rust]
symbol = " "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#d3869b bg:#32302f)]($style)'

[java]
symbol = "󰬷 "
style = "bg:#32302f"
format = '[[ $symbol ($version) ](fg:#d3869b bg:#32302f)]($style)'

[golang]
symbol = " "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#00ADD8 bg:#32302f)]($style)'

[lua]
symbol = "󰢱 "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#03037E bg:#32302f)]($style)'

[php]
symbol = " "
style = "bg:#32302f"
format = '[[ $symbol($version) ](fg:#8ec07c bg:#32302f)]($style)'

[python]
symbol = " "
style = "fg:#F7BA0A bg:#32302f"
format = '[[ $symbol($version) ($virtualenv) ](fg:#F7BA0A bg:#32302f)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:#282828"
format = '[[  $time ](fg:#ebdbb2 bg:#282828)]($style)'

