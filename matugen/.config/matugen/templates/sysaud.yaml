# sysaud configuration
# Generated by matugen from ~/.config/matugen/templates/sysaud.yaml; edit that file instead.
# Location: $XDG_CONFIG_HOME/sysaud/config.yaml  (usually ~/.config/sysaud/config.yaml)
# All fields are optional — omit any section to use the built-in defaults.

# ---------------------------------------------------------------------------
# Daemon settings
# ---------------------------------------------------------------------------
daemon:
  # Name of the screen locker process to watch for lock/unlock events.
  #
  # How it works: sysaud polls for a running process with this name every 500ms.
  # This approach works for any locker that runs as a foreground process.
  #
  # Tested:
  #   - hyprlock  (Hyprland)
  #
  # Likely to work (same process-watching mechanism, untested):
  #   - swaylock
  #   - gtklock
  #   - waylock
  #
  # Will NOT work without additional support (use D-Bus signals instead):
  #   - gnome-screensaver  (uses org.gnome.ScreenSaver D-Bus interface)
  #   - kscreenlocker      (uses org.freedesktop.ScreenSaver D-Bus interface)
  #   Support for these will be added in a future version.
  lock_app: hyprlock


# ---------------------------------------------------------------------------
# Sound settings
# ---------------------------------------------------------------------------
sound:
  enabled: true

  # XDG sound theme to use for event sounds.
  # Themes are resolved from (in order):
  #   ~/.local/share/sounds/<theme>/
  #   /usr/share/sounds/<theme>/
  #
  # The "freedesktop" theme is the baseline and ships with most distros.
  # Other themes (e.g. "ocean", "glass") can be installed from your package manager
  # or placed in ~/.local/share/sounds/.
  theme: macos

  # Optional: directory to search for sounds BEFORE the XDG theme.
  # Place files as: <custom_dir>/<event-id>.oga  (also .ogg and .wav are tried)
  # Example event IDs: power.ac-plugged, bluetooth.device-connected
  # If a file is not found here, falls back to the XDG theme above.
  #
  # custom_dir: ~/.local/share/sounds/my-sounds


# ---------------------------------------------------------------------------
# Notification settings
# ---------------------------------------------------------------------------
notify:
  enabled: true

  # How long notifications stay on screen (milliseconds).
  # -1 = let the notification server decide
  #  0 = never expire (dismiss manually)
  timeout_ms: 4000

  # XDG icon theme name for notification icons.
  # Leave empty to let the notification server use its default theme.
  # Common values: Adwaita, Papirus, hicolor, breeze, Numix
  #
  # Note: the notification daemon (e.g. dunst, mako, swaync) resolves icon names
  # using its own configured theme — this setting is a hint only and may be
  # ignored by some daemons.
  #
  # Tested notification daemons:
  #   - dunst   (most common on standalone WMs)
  #   - mako    (common on Sway/Wayland)
  #   - swaync  (Sway notification center)
  #
  # GNOME and KDE use their own notification systems and will work automatically
  # via org.freedesktop.Notifications — no extra configuration needed.
  icon_theme: ""

  # Optional: directory to look up icon files before the XDG theme.
  # Files should be named <icon-name>.png or <icon-name>.svg
  # If a matching file is found, its absolute path is passed to the notification
  # daemon directly (bypassing theme resolution).
  #
  # custom_icon_dir: ~/.local/share/icons/my-icons


# ---------------------------------------------------------------------------
# Per-event overrides
# ---------------------------------------------------------------------------
# Fine-tune behaviour for specific events. All fields are optional.
# Omit an event entirely to use the built-in defaults.
#
# Available event IDs:
#   power.ac-plugged          power.ac-unplugged
#   power.battery-low         power.battery-critical    power.battery-level
#   network.wifi-connected    network.network-connected network.network-disconnected
#   network.vpn-connected     network.vpn-disconnected
#   bluetooth.device-connected  bluetooth.device-disconnected
#   bluetooth.adapter-on        bluetooth.adapter-off
#   usb.device-plugged          usb.device-unplugged
#   session.screen-locked       session.screen-unlocked
#   session.suspend             session.resume
#   display.monitor-connected   display.monitor-disconnected
#   disk.mounted                disk.unmounted
#   audio.mute-changed          audio.default-sink-changed  audio.default-source-changed

events:
  power.ac-plugged:
    script: glint --origin bottom-right --primary-color '{{colors.primary.default.hex}}'

  audio.volume-changed:
    icon: gnome-volume-control

  network.vpn-connected:
    notify: true

  session.screen-locked:
    notify: false

  session.screen-unlocked:
    notify: false
    sound: false

  # Example: silence a noisy event
  # audio.mute-changed:
  #   enabled: false

  # Example: run a script when a USB device is plugged in
  # usb.device-plugged:
  #   script: ~/.config/sysaud/scripts/on-usb-plug.sh

  # Example: override the icon for a specific event
  # bluetooth.device-connected:
  #   icon: bluetooth-active
  #   sound: device-added         # XDG sound event ID
  #   notify: true

  # Example: show a persistent notification for battery warnings
  # power.battery-critical:
  #   notify: true
  #   timeout_ms: 0               # never auto-dismiss
  #   sound: dialog-error
