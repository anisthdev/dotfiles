source = $HOME/.config/hypr/colors.conf

$accent = $primary
$accentAlpha = $primaryContainer
$font = SF Pro Display
$font_bold = SF Pro Display Bold
$font_black = SF Pro Display Black

# GENERAL
general {
  hide_cursor = true
}

# AUTH
auth {
  pam:enabled = true
  fingerprint:enabled = true
  fingerprint:retry_delay = 250
}

# BACKGROUND
background {
  monitor =
  path = $image
  blur_passes = 2
  color = $background
}

# LAYOUT
# label {
#   monitor =
#   text = Layout: $LAYOUT
#   color = $text
#   font_size = 25
#   font_family = $font
#   position = 30, -30
#   halign = left
#   valign = top
# }

# TIME
label {
  monitor =
  text = $TIME
  color = $primary_container
  font_size = 80
  font_family = $font_bold
  position = 0, -150
  halign = center
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $primary_container
  font_size = 25
  font_family = $font_bold
  position = 0, -280
  halign = center
  valign = top
}

# USER AVATAR
image {
  monitor =
  path = ~/.face
  size = 150
  border_color = rgba(0, 0, 0, 0)
  position = 0, 50
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 500, 60
  outline_thickness = 0
  dots_size = 0.2
  dots_spacing = 0.4
  dots_center = true
  outer_color = $primary
  inner_color = $background
  font_color = $on_background
  fade_on_empty = false
  placeholder_text = Password
  hide_input = false
  check_color = $accent
  fail_color = $error
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $error
  position = 0, -100
  halign = center
  valign = center
}

# FINGERPRINT
label {
  monitor =
  text = 󰈷
  color = $primary
  font_size = 34
  font_family = JetBrainsMono Nerd Font Propo
  position = 0, -185
  halign = center
  valign = center
}

# FINGERPRINT STATUS (mismatch / disabled after too many attempts)
label {
  monitor =
  text = $FPRINTFAIL
  color = $secondary
  font_size = 13
  font_family = $font
  position = 0, -232
  halign = center
  valign = center
}
