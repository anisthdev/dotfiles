# Laptop multimedia keys for volume and LCD brightness (with notifications)
bindel = ,XF86AudioRaiseVolume, exec, ~/.local/bin/volume.sh raise
bindel = ,XF86AudioLowerVolume, exec, ~/.local/bin/volume.sh lower
bindel = ,XF86AudioMute, exec, ~/.local/bin/volume.sh mute-toggle
bindel = ,XF86AudioMicMute, exec, ~/.local/bin/volume.sh mic-mute-toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.local/bin/brightness.sh raise
bindel = ,XF86MonBrightnessDown, exec, ~/.local/bin/brightness.sh lower
bindel = ,XF86Explorer, exec, ~/.local/bin/monitor-brightness.sh raise
bindel = ,XF86HomePage, exec, ~/.local/bin/monitor-brightness.sh lower

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
