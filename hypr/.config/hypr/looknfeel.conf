# Refer to https://wiki.hyprland.org/Configuring/Variables/

source = $HOME/.config/hypr/colors.conf
general {
    gaps_in = 2
    gaps_out = 5

    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 9
        passes = 2
        new_optimizations = true

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Spring-based easing with overshoot for dynamic feel
    bezier = linear, 1, 1, 1, 1
    bezier = spring, 0.05, 0.9, 0.1, 1.05
    bezier = bouncy, 0.68, -0.6, 0.27, 1.4
    bezier = whip, 0.22, 1.00, 0.36, 1.1
    bezier = overshoot, 0.34, 1.56, 0.64, 1.00

    animation = border, 1, 2.0, spring
    animation = borderangle, 0, 1, linear
    animation = windowsIn, 1, 7.0, spring, slideleft 10%
    animation = windowsOut, 1, 5.0, spring, slideright
    animation = windowsMove, 1, 6.0, overshoot, slide
    animation = fade, 1, 4.0, spring
    animation = layersIn, 1, 4.0, whip, slide
    animation = layersOut, 1, 3.5, bouncy
    animation = fadeLayersIn, 1, 3.5, whip
    animation = fadeLayersOut, 1, 3.0, bouncy
    animation = workspaces, 1, 4.5, whip, slidefade 50%
    animation = specialWorkspace, 1, 5.0, whip, slidevert 30%
}

# Remove 1px border around hyprshot screenshots
layerrule =  match:namespace selection, no_anim 1
layerrule = match:namespace rofi, dim_around on

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = rounding 0, match:workspace w[tv1]
# windowrule = rounding 0, match:workspace f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2 # Always split on the right
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
}
