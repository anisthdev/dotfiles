# Refer to https://wiki.hyprland.org/Configuring/Variables/

source = $HOME/.config/hypr/colors.conf
general {
    gaps_in = 2
    gaps_out = 5

    border_size = 0

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 9
        passes = 2
        new_optimizations = true

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Smooth, macOS-like easing profile
    bezier = linear, 1, 1, 1, 1
    bezier = macEaseOut, 0.22, 1.00, 0.36, 1.00
    bezier = macEaseInOut, 0.65, 0.00, 0.35, 1.00
    bezier = macLayerIn, 0.16, 1.00, 0.30, 1.00
    bezier = macLayerOut, 0.40, 0.00, 1.00, 1.00
    bezier = macWorkspace, 0.18, 0.96, 0.22, 1.00

    animation = border, 1, 2.6, macEaseOut
    animation = borderangle, 0, 1, linear
    animation = windowsIn, 1, 6.0, macEaseOut, slide
    animation = windowsOut, 1, 5.0, macEaseInOut, slide
    animation = windowsMove, 1, 5.6, macEaseOut, slide
    animation = fade, 1, 4.2, macEaseOut
    animation = layersIn, 1, 3.2, macLayerIn, slide
    animation = layersOut, 1, 2.8, macLayerOut
    animation = fadeLayersIn, 1, 3.0, macLayerIn
    animation = fadeLayersOut, 1, 2.6, macLayerOut
    animation = workspaces, 1, 4.0, macWorkspace, slidefade 60%
    animation = specialWorkspace, 1, 3.6, macWorkspace, slidefadevert 40%
}

# Remove 1px border around hyprshot screenshots
layerrule =  match:namespace selection, no_anim 1
layerrule = match:namespace rofi, dim_around on

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = rounding 0, match:workspace w[tv1]
# windowrule = rounding 0, match:workspace f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2 # Always split on the right
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    disable_hyprland_logo = true
    disable_splash_rendering  = true
    focus_on_activate = true
}
