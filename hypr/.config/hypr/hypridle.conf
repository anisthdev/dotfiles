general {
    lock_cmd = qs -p $HOME/Projects/quickbar ipc call lock lock     # quickbar's lock screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 270                                     # 4.5min
    on-timeout = brightnessctl -s set 10%             # dim as a warning before locking
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                     # 5min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                  # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r # screen on when activity is detected
}

listener {
    timeout = 1200                                                # 20min
    condition_cmd = grep -q 0 /sys/class/power_supply/AC0/online  # only on battery
    on-timeout = systemctl suspend
}
