general {
    lock_cmd = pidof hyprlock || hyprlock     # never stack a second lock screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 270                                     # 4.5min
    on-timeout = brightnessctl -s set 10%             # dim as a warning before locking
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                                     # 5min
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = hyprctl dispatch dpms off                   # screen off when timeout has passed
    on-resume = hyprctl dispatch dpms on && brightnessctl -r # screen on when activity is detected
}

listener {
    timeout = 1200                                                # 20min
    condition_cmd = grep -q 0 /sys/class/power_supply/AC0/online  # only on battery
    on-timeout = systemctl suspend
}
