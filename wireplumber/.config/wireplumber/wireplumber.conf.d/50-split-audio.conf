# Use pro-audio profile to expose all outputs simultaneously
# (laptop speakers + HDMI + mic all available at the same time)
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_00_1f.3" }
    ]
    actions = {
      update-props = {
        device.profile = "pro-audio"
      }
    }
  }
  # PCM 0 — ALC256 Analog (laptop speakers / headphone jack)
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-0" }
    ]
    actions = {
      update-props = {
        node.description = "Laptop Speakers"
        node.nick        = "Laptop Speakers"
      }
    }
  }
  # PCM 3 — HDMI 0 (primary display output)
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-3" }
    ]
    actions = {
      update-props = {
        node.description = "HDMI Output"
        node.nick        = "HDMI Output"
      }
    }
  }
  # PCM 0 capture — internal mic
  {
    matches = [
      { node.name = "alsa_input.pci-0000_00_1f.3.pro-input-0" }
    ]
    actions = {
      update-props = {
        node.description = "Internal Microphone"
        node.nick        = "Internal Microphone"
      }
    }
  }
  # Hide unused HDMI outputs (1, 2, 3)
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-7" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-8" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.pci-0000_00_1f.3.pro-output-9" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
