monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3.pro-output-3"
      }
    ]
    actions = {
      update-props = {
        node.description = "Monitor"
        node.nick = "Monitor"
      }
    }
  },
  {
    matches = [
      {
        node.name = "alsa_output.pci-0000_00_1f.3.pro-output-0"
      }
    ]
    actions = {
      update-props = {
        node.description = "Laptop"
        node.nick = "Laptop"
      }
    }
  }
]
