timeline_size=44
timeline_persistency=paused
controls_persistency=paused
top_bar=always
top_bar_controls=no
top_bar_persistency=paused
top_bar_title=${filename/no-ext}
progress=always
progress_size=2
# Near-white for the played part, playhead and other accents
color=position=f1f1f1,match=f1f1f1
opacity=position=1,timeline=0.45,heatmap=0.8,controls=0.45,menu=0.85,tooltip=0.85
controls=play-pause,gap,<has_playlist>prev,<has_playlist>next,gap,mute,volume,gap,time,gap,chapter,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,<video,audio>speed,<has_playlist>items,fullscreen
controls_size=36
controls_spacing=2
# Google Sans Flex has tall line metrics, so libass draws it small; this compensates
font_scale=1.2
icon_set=lucide
# Menus search only after / (or i), as in quickbar; letters are vim keys otherwise
menu_type_to_search=no
# Menu sizes: lean rows, a little padding
menu_item_height=36
menu_padding=6
menu_min_width=300
# right: slider on the window edge; inline: in the controls row (the mute,volume controls)
volume=inline
volume_size=36
volume_step=10
pause_indicator=manual
autoload=yes

# Also treat "Intro" and "Credits" chapters as skippable (Netflix-sourced releases use these).
# Setting this replaces the default, so the Japanese patterns stay listed.
chapter_range_patterns=openings:オープニング,^intro$;endings:エンディング,^credits$,^end credits$
