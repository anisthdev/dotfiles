timeline_size=44
timeline_persistency=paused
progress=always
progress_size=2
# Near-white for the played part, playhead and other accents
color=position=f1f1f1
opacity=position=1,timeline=0.45,heatmap=0.8,controls=0.45
controls=play-pause,<has_playlist>prev,<has_playlist>next,gap,time,gap,chapter,<video,audio>subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<stream>stream-quality,<video,audio>speed,items,menu,fullscreen
controls_size=36
controls_spacing=2
# Google Sans Flex has tall line metrics, so libass draws it small; this compensates
font_scale=1.2
volume=right
volume_size=36
volume_step=10
pause_indicator=manual
autoload=yes
