# Modern mpv baseline
vo=gpu-next
gpu-api=vulkan
hwdec=auto-safe
profile=gpu-hq

# High quality scaling and cleanup
scale=ewa_lanczossharp
cscale=ewa_lanczossharp
dscale=mitchell
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes
deband=yes

# HDR and color handling
target-colorspace-hint=yes
tone-mapping=auto
gamut-mapping-mode=auto

# Smooth UI/video behavior
video-sync=display-resample
interpolation=yes
tscale=oversample

# Window behavior
save-position-on-quit=yes
keep-open=yes
force-window=immediate
autofit-larger=90%x90%
geometry=50%:50%
border=no

# Subtitles and language preferences
sub-auto=fuzzy
audio-file-auto=fuzzy
slang=en,eng
alang=ja,jpn,en,eng,hi,hin
subs-with-matching-audio=no
sub-font-size=42
sub-border-size=2.8
sub-shadow-offset=1
sub-ass-override=no

# Audio
volume=80
volume-max=150

# OSD/OSC integration
osc=no
osd-bar=no
osd-duration=1200
osd-font-size=28

# Screenshots
screenshot-format=png
screenshot-directory=~/Pictures/mpv
screenshot-template="%F-%P"

# Network playback via yt-dlp
ytdl=yes
ytdl-format=bestvideo[height<=?2160]+bestaudio/best
