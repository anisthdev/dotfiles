format = """
[░▒▓](#89b4fa)\
$os\
[$hostname](bg:#a9b665 fg:#585a36)\
[](bg:#b4befe fg:#89b4fa)\
$directory\
[](fg:#b4befe bg:#fab387)\
$git_branch\
$git_status\
[](fg:#fab387 bg:#313244)\
$python\
$nodejs\
$java\
$rust\
$golang\
$php\
[](fg:#313244)\
$line_break$character"""

[os]
disabled = false
style = "bg:#89b4fa fg:#1e1e2e"
format = "[$symbol]($style)"

[os.symbols]
Ubuntu = " 󰕈 "
Arch = " 󰣇 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "

[directory]
style = "fg:#1e1e2e bg:#b4befe"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󱔘 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Study" = "󱉟 "
"Work" = "󱔟 "

[git_branch]
symbol = ""
style = "bg:#fab387"
format = '[[ $symbol $branch ](fg:#1e1e2e bg:#fab387)]($style)'

[git_status]
style = "bg:#fab387"
format = '[[($all_status$ahead_behind )](fg:#1e1e2e bg:#fab387)]($style)'

# --- Language Tooling ---

[python]
symbol = " "
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#f9e2af bg:#313244)]($style)'

[nodejs]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#a6e3a1 bg:#313244)]($style)'

[java]
symbol = "󰬷"
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#f38ba8 bg:#313244)]($style)'

[rust]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#fab387 bg:#313244)]($style)'

[golang]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#89dceb bg:#313244)]($style)'

[php]
symbol = ""
style = "bg:#313244"
format = '[[ $symbol ($version) ](fg:#cba6f7 bg:#313244)]($style)'

# --- Final Prompt Character ---

[line_break]
disabled = false

[character]
success_symbol = "[~>](bold #a6e3a1)" # Green
error_symbol = "[~>](bold #f38ba8)"   # Red
